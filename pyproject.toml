[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-pipeline"
version = "0.1.0"
description = "Fraud detection pipeline: DuckDB SQL features, Random Forest, SageMaker serving, CloudWatch monitoring"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraud = ["features/sql/*.sql", "features/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
